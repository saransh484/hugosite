summary: I build reliable, automated infrastructure for modern applications.
details:
  - My journey in DevOps started with a curiosity about what happens behind the
    scenes when software goes from code to production. Today, I work with cloud
    infrastructure, Kubernetes, Terraform, CI/CD, and observability to build
    systems that are scalable, reproducible, and resilient.
  - I enjoy understanding systems from the ground up — from networking and
    security to deployments, automation, and the inevitable moment when
    something breaks at 2 AM.
