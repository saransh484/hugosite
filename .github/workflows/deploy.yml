name: Build and Deploy to GCP VM

on:
  push:
    branches:
      - main
  workflow_dispatch:

concurrency:
  group: deploy-to-gcp
  cancel-in-progress: true

jobs:
  build-and-deploy:
    name: Build & Deploy
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4
        with:
          submodules: recursive
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: 'npm'

      - name: Install NPM Dependencies
        run: npm ci

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version: '>=1.22'
          cache: true

      - name: Setup Hugo
        uses: peaceiris/actions-hugo@v3
        with:
          hugo-version: 'latest'
          extended: true

      - name: Build Hugo Site
        run: |
          export PATH="$PWD/node_modules/.bin:$PATH"
          hugo --minify

      - name: Deploy to GCP VM via SCP
        uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ secrets.GCP_HOST || secrets.GCP_VM_HOST }}
          username: ${{ secrets.GCP_USERNAME || secrets.GCP_VM_USER }}
          key: ${{ secrets.GCP_SSH_KEY || secrets.GCP_SSH_PRIVATE_KEY }}
          port: 22
          source: "public/*"
          target: ${{ secrets.GCP_TARGET_DIR || '/home/saranshplay/hugo/public' }}
          strip_components: 1
          rm: true
