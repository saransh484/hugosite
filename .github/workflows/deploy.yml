name: Build and Deploy to GCP VM

on:
  push:
    branches:
      - main
  workflow_dispatch:

concurrency:
  group: deploy-to-gcp
  cancel-in-progress: true

jobs:
  build-and-deploy:
    name: Build & Deploy
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4
        with:
          submodules: recursive
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: 'npm'

      - name: Install NPM Dependencies
        run: npm ci

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version: '>=1.22'
          cache: true

      - name: Setup Hugo
        uses: peaceiris/actions-hugo@v3
        with:
          hugo-version: 'latest'
          extended: true

      - name: Build Hugo Site
        run: |
          export PATH="$PWD/node_modules/.bin:$PATH"
          hugo --minify

      - name: Install Rsync
        run: |
          sudo apt-get update
          sudo apt-get install -y rsync

      - name: Deploy to GCP VM via Rsync
        env:
          SSH_PRIVATE_KEY: ${{ secrets.GCP_SSH_PRIVATE_KEY }}
          REMOTE_HOST: ${{ secrets.GCP_VM_HOST }}
          REMOTE_USER: ${{ secrets.GCP_VM_USER }}
          TARGET_DIR: ${{ secrets.GCP_TARGET_DIR }}
        run: |
          # Setup SSH
          mkdir -p ~/.ssh
          echo "$SSH_PRIVATE_KEY" | tr -d '\r' > ~/.ssh/id_ed25519_deploy
          chmod 600 ~/.ssh/id_ed25519_deploy
          ssh-keyscan -H "$REMOTE_HOST" >> ~/.ssh/known_hosts

          # Sync public build output to the target web server directory
          rsync -avz --delete -e "ssh -i ~/.ssh/id_ed25519_deploy" public/ "$REMOTE_USER@$REMOTE_HOST:$TARGET_DIR"
